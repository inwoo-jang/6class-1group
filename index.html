    <!--
      Pretendard 와 Jua 는 갤러리 껍데기가 아니라 팀원 결과물이 쓰는 글꼴이다.
      각자 저장소에서는 그 사람의 index.html 에 이 링크가 있었는데,
      우리는 src/members/<이름>/ 폴더만 가져왔으니 링크가 따라오지 않았다.
      그래서 글꼴 이름만 남고 실물이 없어, 원본과 다른 글씨로 그려지고 있었다.
      결과물 폴더를 옮길 때 같이 챙겨야 하는 것은 코드만이 아니다.
    -->
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <!-- 첫 칠에서 색이 번쩍이지 않도록, 화면이 그려지기 전에 밝기를 정해 둔다 -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('gallery-theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
