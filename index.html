<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKALA · 6반 1조 — Vue 결과물</title>
    <meta name="description" content="SKALA Vue.js 과정 6반 1조가 각자 만든 화면 모음" />
    <link rel="icon" href="data:," />

    <!--
      글자는 두 종류만 쓴다.
      본문은 Helvetica 한 크기로 눌러 두고, 이름표 한 곳에서만 세리프를 쓴다.
      한 군데서만 쓰기 때문에 그 한 줄이 눈에 걸린다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- 첫 칠에서 색이 번쩍이지 않도록, 화면이 그려지기 전에 밝기를 정해 둔다 -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('gallery-theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
